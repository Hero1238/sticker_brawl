name: Build Sticker Brawl APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Init Android files
        run: flutter create --platforms=android .
      - name: Fix image check
        run: |
          sed -i 's/android {/android {\n    aaptOptions.cruncherEnabled = false\n    aaptOptions.useNewCruncher = false/g' android/app/build.gradle*
      - name: Build APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          archive: false
          
